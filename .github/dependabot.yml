# Keep dependencies (and their security fixes) current with weekly PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # velq-acp is written against the 1.x high-level client API
      # (Client::builder / connect_with / attach_session / read_update).
      # 2.0 made `attach_session` private, so the major has to be a
      # deliberate port, not a weekly bot bump.
      - dependency-name: "agent-client-protocol"
        update-types: ["version-update:semver-major"]
      # `capture_to_pdf` casts the ICoreWebView2 that Tauri's own
      # `with_webview` hands back, so our webview2-com/windows must be the
      # same copies Tauri links. Bumping ahead of Tauri puts two sets of COM
      # types in the tree and Windows stops compiling (E0277/E0599). These
      # move only when Tauri moves.
      - dependency-name: "webview2-com"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
